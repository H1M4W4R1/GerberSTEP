[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gerberstep"
version = "0.1.0"
description = "Layer-aware Gerber to STEP desktop converter"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PyQt6>=6.8,<7", "qtawesome>=1.4,<2", "gerbonara==1.6.3",
  "shapely>=2.1,<3", "cadquery>=2.6,<3", "numpy>=2,<3",
  "pyqtgraph>=0.14,<0.15", "PyOpenGL>=3.1.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.22,<7"]

[project.gui-scripts]
gerberstep = "gerberstep.app:main"

[tool.setuptools.packages.find]
include = ["gerberstep*"]

[tool.setuptools.package-data]
gerberstep = ["assets/*.svg", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
